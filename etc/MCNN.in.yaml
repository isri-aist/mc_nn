---
# Solver feedback used by the controller's run(): None (= OpenLoop), Joints,
# JointsWVelocity, ObservedRobots (= ClosedLoop) or ClosedLoopIntegrateReal.
# Published to mc_nn contracts as "MCNN::FeedbackType" (SafeCBFTorquePolicyContract expects ClosedLoopIntegrateReal).
FeedbackType: None
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: true
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: false
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
# If true, state factory will be more verbose
VerboseStateFactory: false

robots:
  ground:
    module: env/ground
constraints:
  - type: contact
  - type: dynamics
    damper: [0.1, 0.01, 0.5]
  - type: compoundJoint
contacts:
  - r2: ground
    r1Surface: LeftFootCenter
    r2Surface: AllGround
  - r2: ground
    r1Surface: RightFootCenter
    r2Surface: AllGround
states:
  TryBothPolicies:
    base: RunNNBase
    active_policies: [dummy_example, posture_dummy_example]
    policies:
      - onnx: ["dummy_example"]
        contract: RandomPolicyContract
        policy_hz: 10.0
        print_every: 10
      - onnx: ["dummy_example"]
        prefix: "posture_" #We need to add a prefix to avoid naming conflict with already configured policy named "dummy_example" fro RandomPolicyContract
        contract: PostureTaskPolicyContract
        policy_hz: 2.0
        joints: [L_WRIST_R, R_WRIST_R, NECK_Y]
        weight: 1.0
        stiffness: 10.0
transitions:
  - [TryBothPolicies, OK, TryBothPolicies, Strict]
init: TryBothPolicies
